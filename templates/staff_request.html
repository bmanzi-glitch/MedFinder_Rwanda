{% extends "base.html" %}
{% block title %}{{ t.req_title }} - {{ t.title }}{% endblock %}
{% block body %}
<div class="login-wrap" style="max-width:640px">
  <h1>{{ t.req_title }}</h1>
  <p class="muted">{{ t.req_lead }}</p>
  <form method="post" class="panel" style="margin-top:16px">
    <input type="hidden" name="csrf" value="{{ csrf_token() }}">
    <div class="fgrid">
      <div>
        <label class="lbl" for="r_name">{{ t.req_name }}</label>
        <input class="inp" id="r_name" name="name" value="{{ form.name }}" maxlength="60" autocomplete="name" required>
      </div>
      <div>
        <label class="lbl" for="r_phone">{{ t.phone }}</label>
        <input class="inp" id="r_phone" name="phone" type="tel" inputmode="tel" value="{{ form.phone }}" placeholder="0788 123 456" autocomplete="tel" required>
      </div>
      <div>
        <label class="lbl" for="r_job">{{ t.req_job }}</label>
        <input class="inp" id="r_job" name="job_title" value="{{ form.job_title }}" maxlength="60" placeholder="Pharmacist">
      </div>
      <div>
        <label class="lbl" for="r_fac">{{ t.req_facility }}</label>
        <select class="inp" id="r_fac" name="facility_id">
          <option value="0">{{ t.req_not_listed }}</option>
          {% for f in facilities %}<option value="{{ f.facility_id }}" {{ 'selected' if form.facility_id|string == f.facility_id|string }}>{{ f.name }} ({{ f.district }})</option>{% endfor %}
        </select>
      </div>
      <div>
        <label class="lbl" for="r_fname">{{ t.req_fname }}</label>
        <input class="inp" id="r_fname" name="facility_name" value="{{ form.facility_name }}" maxlength="80">
      </div>
      <div>
        <label class="lbl" for="r_dist">{{ t.req_district_note }}</label>
        <input class="inp" id="r_dist" name="district" value="{{ form.district }}" maxlength="40" placeholder="Gasabo">
      </div>
      <div class="full">
        <label class="lbl" for="r_msg">{{ t.req_msg }}</label>
        <textarea class="inp" id="r_msg" name="message" rows="3" maxlength="300">{{ form.message }}</textarea>
      </div>
    </div>
    <button class="btn" style="margin-top:16px">{{ t.req_submit }}</button>
  </form>
  <p class="muted">{{ t.req_have_account }} <a href="{{ url_for('login') }}">{{ t.login }}</a></p>
</div>
{% endblock %}
