{% extends "base.html" %}
{% block title %}{{ code }} - {{ t.title }}{% endblock %}
{% block body %}
<div class="empty" style="text-align:center;margin-top:24px">
  <h1 style="font-size:3rem;color:var(--muted)">{{ code }}</h1>
  <h3 style="margin-top:6px">{{ t['err_' ~ code ~ '_h'] }}</h3>
  <p>{{ t['err_' ~ code ~ '_p'] }}</p>
  <a class="btn" style="display:inline-block;text-decoration:none" href="{{ url_for('home') }}">{{ t.go_home }}</a>
</div>
{% endblock %}
