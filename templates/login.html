{% extends "base.html" %}
{% block title %}{{ t.login }} - {{ t.title }}{% endblock %}
{% block body %}
<div class="login-wrap">
  <h1>{{ t.login }}</h1>
  <p class="muted">{{ t.login_lead }}</p>
  <form method="post" class="panel" style="margin-top:16px">
    <input type="hidden" name="csrf" value="{{ csrf_token() }}">
    <label class="lbl" for="phone">{{ t.phone }}</label>
    <input class="inp" id="phone" name="phone" type="tel" inputmode="tel" autocomplete="username" placeholder="0788 123 456" required>
    <label class="lbl" for="pin" style="margin-top:12px">{{ t.pin }}</label>
    <input class="inp" id="pin" name="pin" type="password" inputmode="numeric" autocomplete="current-password" required>
    <button class="btn" style="margin-top:16px;width:100%">{{ t.login_btn }}</button>
  </form>
  <p class="muted">{{ t.need_account }} <a href="{{ url_for('signup') }}">{{ t.nav_signup }}</a></p>
  <p class="muted"><a href="{{ url_for('staff_request') }}">{{ t.foot_staff }}</a></p>
</div>
{% endblock %}
