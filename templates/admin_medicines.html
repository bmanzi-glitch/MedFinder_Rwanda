{% extends "base.html" %}
{% block body %}
<div class="hello">
  <span class="ico" aria-hidden="true"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.5 20.5l-7-7a4.95 4.95 0 0 1 7-7l7 7a4.95 4.95 0 0 1-7 7zM8.5 8.5l7 7"/></svg></span>
  <div class="grow"><h1>{{ t.nav_medicines }}</h1><p>{{ t.admin_h }}</p></div>
</div>

<section class="panel">
  <h2>{{ t.med_add_h }}</h2>
  <form method="post" action="{{ url_for('admin_medicines') }}" class="rowform five">
    <input type="hidden" name="csrf" value="{{ csrf_token() }}">
    <input class="inp" name="name" placeholder="{{ t.m_name }}" aria-label="{{ t.m_name }}" required>
    <input class="inp" name="strength" placeholder="{{ t.m_strength }}" aria-label="{{ t.m_strength }}">
    <input class="inp" name="form" placeholder="{{ t.m_form }}" aria-label="{{ t.m_form }}">
    <input class="inp" name="aliases" placeholder="{{ t.m_aliases }}" aria-label="{{ t.m_aliases }}">
    <button class="btn">{{ t.add_medicine }}</button>
  </form>
</section>

<section class="panel">
  <h2>{{ t.med_list_h }}</h2>
  {% for m in medicines %}
  <form method="post" action="{{ url_for('admin_medicine_edit', mid=m.medicine_id) }}" class="rowform five" style="margin-bottom:10px">
    <input type="hidden" name="csrf" value="{{ csrf_token() }}">
    <input class="inp" name="name" value="{{ m.name }}" aria-label="{{ t.m_name }}" required>
    <input class="inp" name="strength" value="{{ m.strength or '' }}" aria-label="{{ t.m_strength }}">
    <input class="inp" name="form" value="{{ m.form or '' }}" aria-label="{{ t.m_form }}">
    <input class="inp" name="aliases" value="{{ m.aliases or '' }}" aria-label="{{ t.th_aliases }}" placeholder="{{ t.m_aliases }}">
    <button class="btn ghost sm">{{ t.save_short }}</button>
  </form>
  {% endfor %}
</section>
{% endblock %}
